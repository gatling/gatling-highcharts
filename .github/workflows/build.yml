name: build

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CURRENT_VERSION: "3.6.0"
      JAVA_OPTS: "-Xmx6G"
      SBT_OPTS: "-Dsbt.ci=true"
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66 # 0.13.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout gatling/gatling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gatling/gatling
          ref: main
          path: gatling

      - name: Checkout gatling/gatling-highcharts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gatling-highcharts

      - name: Setup JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup sbt
        uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8

      - name: Cache SBT
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.ivy2/cache
            ~/.cache/coursier
            ~/.sbt/launchers
            ~/.sbt/boot
            ~/.sbt/preloaded
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/plugins.sbt', '**/build.properties') }}

      - name: Publish gatling locally
        working-directory: gatling
        run: |
          sbt -Dproject.version="$CURRENT_VERSION" publishLocal

      - name: Test
        working-directory: gatling-highcharts
        run: |
          sbt \
            -Dproject.version="$CURRENT_VERSION" \
            "headerCheck;" \
            "scalafmtSbtCheck;" \
            "scalafmtCheckAll;" \
            "scalafixAll --check;" \
            "test;"
